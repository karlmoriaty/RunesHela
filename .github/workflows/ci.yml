name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RunesHela.slnx

      - name: Build
        run: dotnet build RunesHela.slnx -c Release --no-restore

      - name: Test runtime
        run: dotnet test tests/RunesHela.Tests/RunesHela.Tests.csproj -c Release --no-build

      - name: Test generator
        run: dotnet test tests/RunesHela.Generator.Tests/RunesHela.Generator.Tests.csproj -c Release --no-build

  aot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Native AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT
        run: dotnet publish samples/AotCli/AotCli.csproj -c Release -r linux-x64 -o artifacts/aot/linux-x64

      - name: Smoke test AOT binary
        run: ./artifacts/aot/linux-x64/AotCli --help

      - name: Measure AOT startup
        run: |
          python3 - <<'PY'
          import statistics
          import subprocess
          import time

          times = []
          for _ in range(30):
              start = time.perf_counter()
              subprocess.run(
                  ["./artifacts/aot/linux-x64/AotCli", "--help"],
                  stdout=subprocess.DEVNULL,
                  check=True,
              )
              times.append((time.perf_counter() - start) * 1000)

          times.sort()
          p50 = statistics.median(times)
          p95 = times[int(len(times) * 0.95) - 1]
          print(f"AOT startup p50={p50:.2f} ms p95={p95:.2f} ms min={times[0]:.2f} ms max={times[-1]:.2f} ms")
          PY

      - name: Record AOT binary size
        run: ls -lh artifacts/aot/linux-x64/AotCli
