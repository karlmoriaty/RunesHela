name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RunesHela.slnx

      - name: Build
        run: dotnet build RunesHela.slnx -c Release --no-restore -m:1

      - name: Test runtime
        run: dotnet test tests/RunesHela.Tests/RunesHela.Tests.csproj -c Release --no-build

      - name: Test generator
        run: dotnet test tests/RunesHela.Generator.Tests/RunesHela.Generator.Tests.csproj -c Release --no-build

      - name: Test integration
        run: dotnet test tests/RunesHela.Integration.Tests/RunesHela.Integration.Tests.csproj -c Release --no-build

      - name: Test performance budgets
        run: dotnet test tests/RunesHela.Performance.Tests/RunesHela.Performance.Tests.csproj -c Release --no-build

  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RunesHela.slnx

      - name: Build
        run: dotnet build RunesHela.slnx -c Release --no-restore -m:1

      - name: Pack
        run: dotnet pack src/RunesHela/RunesHela.csproj -c Release --no-build -o artifacts/packages -p:ContinuousIntegrationBuild=true

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import zipfile

          package = glob.glob("artifacts/packages/*.nupkg")[0]
          required = {
              "lib/net10.0/RunesHela.dll",
              "lib/net10.0/RunesHela.xml",
              "analyzers/dotnet/cs/RunesHela.Generator.dll",
              "README.md",
              "NOTICE",
          }

          with zipfile.ZipFile(package) as archive:
              names = set(archive.namelist())

          missing = sorted(required - names)
          if missing:
              print("Missing package entries: " + ", ".join(missing))
              sys.exit(1)

          print("Package contents verified: " + package)
          PY

      - name: Consumer smoke test
        run: |
          mkdir -p /tmp/runeshela-consumer
          cd /tmp/runeshela-consumer
          dotnet new console -n Consumer -o . --force > /dev/null
          dotnet add package RunesHela --version 1.0.0 --source "$GITHUB_WORKSPACE/artifacts/packages" > /dev/null
          cat > Program.cs <<'CS'
          using RunesHela;

          return RunesHelaApp.Run(args);

          [Command("greet", Description = "Greets.")]
          public sealed class GreetCommand
          {
              [Argument(0, Description = "Name.")]
              public string Name { get; init; } = "world";

              [Option(Description = "Uppercase.")]
              public bool Loud { get; init; }

              public void Run()
              {
                  var text = "Hello, " + Name + "!";
                  System.Console.WriteLine(Loud ? text.ToUpperInvariant() : text);
              }
          }
          CS
          dotnet run -c Release -- greet Ada --loud | grep -q "HELLO, ADA!"

      - name: Generate SBOM
        run: |
          for package in artifacts/packages/*.nupkg; do
            python3 build/generate-sbom.py "$package" artifacts/sbom
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/packages/*
            artifacts/sbom/*
          if-no-files-found: error

  perf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Performance budgets
        run: dotnet test tests/RunesHela.Performance.Tests/RunesHela.Performance.Tests.csproj -c Release

      - name: Micro benchmarks
        run: dotnet run --project benchmarks/RunesHela.Benchmarks/RunesHela.Benchmarks.csproj -c Release -- --filter "*" --job short --exporters json

      - name: Enforce benchmark budgets
        run: |
          python3 - <<'PY'
          import glob
          import json
          import sys

          limits = {
              "FiveOptions": 1100.0,
              "Help": 5500.0,
              "Error": 5500.0,
              "Route": 1100.0,
          }

          failed = False
          found = 0

          for path in glob.glob("BenchmarkDotNet.Artifacts/results/*.json"):
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)

              for benchmark in data.get("Benchmarks", []):
                  method = benchmark.get("Method")

                  if method not in limits:
                      continue

                  found += 1
                  mean = benchmark["Statistics"]["Mean"]
                  status = "PASS" if mean <= limits[method] else "FAIL"
                  print(f"{method}: {mean:.2f} ns (limit {limits[method]:.0f} ns) {status}")

                  if mean > limits[method]:
                      failed = True

          if found == 0:
              print("No benchmark results were found.")
              sys.exit(1)

          sys.exit(1 if failed else 0)
          PY

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: BenchmarkDotNet.Artifacts/results/*.json
          if-no-files-found: error

  aot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT
        shell: bash
        run: |
          dotnet publish samples/AotCli/AotCli.csproj -c Release -r ${{ matrix.rid }} -o artifacts/aot/${{ matrix.rid }}
          dotnet publish samples/EmptyAot/EmptyAot.csproj -c Release -r ${{ matrix.rid }} -o artifacts/aot/${{ matrix.rid }}

      - name: Smoke test AOT binaries
        shell: bash
        run: |
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          ./artifacts/aot/${{ matrix.rid }}/AotCli$exe --help
          ./artifacts/aot/${{ matrix.rid }}/AotCli$exe greet Ada -t Hi
          ./artifacts/aot/${{ matrix.rid }}/AotCli$exe completion bash > /dev/null
          ./artifacts/aot/${{ matrix.rid }}/AotCli$exe docs > /dev/null
          ./artifacts/aot/${{ matrix.rid }}/AotCli$exe man > /dev/null
          ./artifacts/aot/${{ matrix.rid }}/AotCli$exe mcp --manifest > /dev/null

      - name: Measure AOT startup and size
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import statistics
          import subprocess
          import time

          def measure(path, *args):
              times = []
              for _ in range(30):
                  start = time.perf_counter()
                  subprocess.run([path, *args], stdout=subprocess.DEVNULL, check=True)
                  times.append((time.perf_counter() - start) * 1000)
              times.sort()
              return statistics.median(times), times[int(len(times) * 0.95) - 1]

          empty_p50, empty_p95 = measure("./artifacts/aot/linux-x64/EmptyAot")
          app_p50, app_p95 = measure("./artifacts/aot/linux-x64/AotCli", "--help")
          print(f"EmptyAot p50={empty_p50:.2f} ms p95={empty_p95:.2f} ms")
          print(f"AotCli   p50={app_p50:.2f} ms p95={app_p95:.2f} ms")
          print(f"Delta    p50={app_p50 - empty_p50:.2f} ms p95={app_p95 - empty_p95:.2f} ms")

          empty_size = os.path.getsize("./artifacts/aot/linux-x64/EmptyAot")
          app_size = os.path.getsize("./artifacts/aot/linux-x64/AotCli")
          print(f"Size EmptyAot={empty_size} bytes AotCli={app_size} bytes Delta={app_size - empty_size} bytes")
          PY

  trimmed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish trimmed single-file
        run: |
          dotnet publish samples/AotCli/AotCli.csproj -c Release -r linux-x64 \
            -p:PublishAot=false -p:PublishTrimmed=true -p:PublishSingleFile=true -p:SelfContained=true \
            -o artifacts/trim/linux-x64

      - name: Smoke test trimmed single-file
        run: ./artifacts/trim/linux-x64/AotCli --help

      - name: Publish ReadyToRun
        run: |
          dotnet publish samples/AotCli/AotCli.csproj -c Release -r linux-x64 \
            -p:PublishAot=false -p:PublishReadyToRun=true -p:SelfContained=false \
            -o artifacts/r2r/linux-x64

      - name: Smoke test ReadyToRun
        run: ./artifacts/r2r/linux-x64/AotCli --help

      - name: Record artifact sizes
        run: stat -c '%n %s bytes' artifacts/trim/linux-x64/AotCli artifacts/r2r/linux-x64/AotCli
