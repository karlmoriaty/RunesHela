name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by trailers
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0

          for commit in $(git rev-list "$base..$head"); do
            if ! git show -s --format=%B "$commit" | grep -qiE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $commit is missing a Signed-off-by trailer. Use 'git commit -s'."
              missing=1
            fi
          done

          exit $missing
